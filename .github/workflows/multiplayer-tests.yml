name: Multiplayer foundation tests

on:
  push:
    branches: [feature/multiplayer-v0-1]
    paths:
      - 'server/**'
      - 'js/**'
      - '.github/workflows/multiplayer-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/multiplayer-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check index.js
      - run: node --check rooms.js
      - run: node --check ../js/main.js
      - run: node --check ../js/combat.js
      - run: node --check ../js/weapon.js
      - run: node --check ../js/character.js
